trigger:
  batch: true
  branches:
    include:
      - "main"

variables:
- name: BuildPlatform
  value : 'x64'
- name: BuildConfiguration
  value: 'release'
- name: SolutionBaseName
  value: 'SFA.DAS.Payments.ScheduledJobs'
- name: ArtifactName
  value: 'ScheduledJobs-FunctionApp'
- group: Release Management Resources
- group: RELEASE das-payments-v2-scheduledjobsfunction

resources:
  repositories:
    - repository: self
    - repository: das-platform-building-blocks
      type: github
      name: SkillsFundingAgency/das-platform-building-blocks
      endpoint: SkillsFundingAgency
      ref: refs/heads/master
    - repository: das-platform-automation
      type: github
      name: SkillsFundingAgency/das-platform-automation
      endpoint: SkillsFundingAgency
      ref: refs/heads/master

stages:
- stage: Build_Unit_Tests
  displayName: 'Build and Unit Tests'
  jobs:
  - template: pipeline-templates/job/code-build.yml
  - template: pipeline-templates/job/unittests.yml

- stage: Deploy_DAS
  dependsOn: Build_Unit_Tests
  displayName: Deploy to DAS
  variables:
  - group: DAS das-payments-v2-scheduledjobsfunction
  jobs:
  - template: pipeline-templates/job/deploy.yml
    parameters:
      ServiceConnection: DCT-VSO
      SolutionBaseName: ${{ variables.SolutionBaseName }}
      ArtifactName: $(ArtifactName)
      Environment: DAS

